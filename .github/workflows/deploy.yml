name: GitHub Pages 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: 공개 Supabase 설정 확인
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo 'VITE_SUPABASE_URL 변수가 필요합니다.'; exit 1; }
          test -n "$SUPABASE_KEY" || { echo 'VITE_SUPABASE_PUBLISHABLE_KEY 변수가 필요합니다.'; exit 1; }
          case "$SUPABASE_KEY" in sb_secret_*) echo '비공개 키는 사용할 수 없습니다.'; exit 1;; esac
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: DB 규칙 검증 (일회용 DB)
        env:
          DATABASE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker cp supabase "$DATABASE_CONTAINER:/tmp/supabase"
          docker exec "$DATABASE_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -f /tmp/supabase/tests/reports.sql
  deploy:
    needs: [build, database]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
